# OASIS — Local development compose file
# Brings up Postgres + the backend API. The frontend is run separately via
# `npm run dev` in `frontend/` (see docs/06-deployment-and-docker.md for why).
#
# Usage:
#   cd docker/
#   docker compose up --build
#
# This file is for LOCAL DEVELOPMENT ONLY. Production deployment targets
# (Render/Railway/DigitalOcean/AWS/VPS) use backend.Dockerfile directly with
# a managed Postgres instance — they do not use this compose file.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: oasis_dev_password
      POSTGRES_DB: oasis_dev
    ports:
      - "5432:5432"
    volumes:
      - oasis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oasis -d oasis_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://oasis:oasis_dev_password@postgres:5432/oasis_dev
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  oasis_postgres_data:
